server {
    listen 80;
    root /usr/share/nginx/html;

    # Resolve the remote containers lazily through Docker's DNS. With a literal
    # upstream nginx resolves at boot and refuses to start if a remote is down,
    # which would defeat the point of the shell surviving a remote outage.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $people_upstream http://people:80;
    set $delivery_upstream http://delivery:80;

    # Redirects must keep the browser-facing host and port (localhost:8080),
    # not the container's internal port 80.
    absolute_redirect off;

    # Bundles are not content-hashed: browsers revalidate with the ETag on every
    # load rather than reusing a cached copy after a rebuild or a remote outage.
    add_header Cache-Control "no-cache" always;

    # Standalone builds of the remotes, proxied under a prefix the shell does not route.
    # The shell's own routes are /people and /delivery, so they cannot share these paths.
    location /remotes/people/ {
        rewrite ^/remotes/people/(.*)$ /$1 break;
        proxy_hide_header Cache-Control;
        proxy_pass $people_upstream;
    }

    location /remotes/delivery/ {
        rewrite ^/remotes/delivery/(.*)$ /$1 break;
        proxy_hide_header Cache-Control;
        proxy_pass $delivery_upstream;
    }

    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # Everything else is the shell; deep links like /delivery load index.html.
    location / {
        try_files $uri /index.html;
    }
}
