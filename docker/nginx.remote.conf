server {
    listen 80;
    root /usr/share/nginx/html;

    # A remote may be loaded by a shell on another origin.
    add_header Access-Control-Allow-Origin "*" always;

    # Bundles are not content-hashed, and remoteEntry.js must reflect the running
    # container: browsers revalidate with the ETag on every load instead of reusing
    # a cached copy. Unchanged files still answer 304, so this costs one request.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri /index.html;
    }
}
